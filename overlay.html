<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  #overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  .marker {
    position: absolute;
    width: 50px; height: 50px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    font-family: sans-serif;
    font-size: 13px;
    border: 3px solid white;
  }
  .marker.pending {
    background: repeating-linear-gradient(45deg, rgba(255,176,32,0.5) 0 10px, rgba(255,176,32,0.2) 10px 20px);
    border-color: #ffb020;
    border-style: dashed;
  }
  .marker.linked {
    background: rgba(46, 204, 113, 0.7);
  }
  .marker.frozen {
    opacity: 0.35;
    border-style: dashed;
    filter: grayscale(0.6);
  }
</style>
</head>
<body>
<div id="overlay"></div>
<script type="module" src="overlay.js"></script>
</body>
</html>
