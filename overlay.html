<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  #overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  .marker {
    position: absolute;
    width: 50px; height: 50px;
    border-radius: 50%;
    background: rgba(255, 50, 50, 0.6);
    border: 3px solid white;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    font-family: sans-serif;
  }
  #debug {
    position: fixed;
    top: 10px; left: 10px;
    background: rgba(0,0,0,0.7);
    color: #0f0;
    font-family: monospace;
    padding: 8px;
    border-radius: 6px;
    font-size: 12px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="overlay"></div>
<div id="debug">Lade SDK...</div>

<script type="module">
import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk/dist/index.min.js";

const overlay = document.getElementById("overlay");
const debug = document.getElementById("debug");
let points = new Map();

OBR.onReady(() => {
  debug.textContent = "SDK bereit. Transparenz-Test aktiv.";
});

function render(id, x, y) {
  let el = points.get(id);
  if (!el) {
    el = document.createElement("div");
    el.className = "marker";
    overlay.appendChild(el);
    points.set(id, el);
  }
  el.style.left = x + "px";
  el.style.top = y + "px";
  el.textContent = id;
  debug.textContent = `Aktive Punkte: ${points.size} | letzte ID: ${id} @ (${Math.round(x)},${Math.round(y)})`;
}

function remove(id) {
  const el = points.get(id);
  if (el) { el.remove(); points.delete(id); }
  debug.textContent = `Aktive Punkte: ${points.size}`;
}

overlay.addEventListener("pointerdown", (e) => render(e.pointerId, e.clientX, e.clientY));
overlay.addEventListener("pointermove", (e) => { if (points.has(e.pointerId)) render(e.pointerId, e.clientX, e.clientY); });
overlay.addEventListener("pointerup", (e) => remove(e.pointerId));
overlay.addEventListener("pointercancel", (e) => remove(e.pointerId));
overlay.addEventListener("contextmenu", (e) => e.preventDefault());
</script>
</body>
</html>
