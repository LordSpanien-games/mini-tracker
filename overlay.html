<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  #overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }
  .marker {
    position: absolute;
    width: 50px; height: 50px;
    border-radius: 50%;
    background: rgba(255, 50, 50, 0.6);
    border: 3px solid white;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
    font-family: sans-serif;
  }
  #debug {
    position: fixed;
    top: 10px; left: 10px;
    background: rgba(0,0,0,0.7);
    color: #0f0;
    font-family: monospace;
    padding: 8px;
    border-radius: 6px;
    font-size: 12px;
    pointer-events: none;
  }
  #tokenPanel {
    position: fixed;
    top: 10px; right: 10px;
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-family: monospace;
    font-size: 12px;
    padding: 10px;
    border-radius: 6px;
    max-height: 300px;
    overflow-y: auto;
    min-width: 180px;
    pointer-events: none;
  }
  #tokenPanel h3 { margin: 0 0 6px 0; font-size: 12px; color: #6cf; }
  #tokenPanel .tok { padding: 2px 0; border-bottom: 1px solid #333; }
</style>
</head>
<body>
<div id="overlay"></div>
<div id="debug">Lade SDK...</div>
<div id="tokenPanel"><h3>Scene Tokens</h3><div id="tokenList">lade...</div></div>
<script type="module" src="overlay.js"></script>
</body>
</html>
