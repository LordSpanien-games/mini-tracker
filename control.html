<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; font-family: sans-serif; background: #0d1117; color: #e6edf3; padding: 16px; }
  h2 { color: #58a6ff; font-size: 16px; }
  h3 { color: #8b949e; font-size: 12px; text-transform: uppercase; }
  .contact { background: #161b22; border: 1px solid #ffb020; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .contact .label { color: #ffb020; font-weight: bold; margin-bottom: 6px; font-size: 13px; }
  .tokenOption { background: #21262d; padding: 6px 10px; border-radius: 5px; margin-bottom: 4px; cursor: pointer; font-size: 13px; }
  .tokenOption:hover { background: #30363d; }
  #empty { color: #6e7681; font-style: italic; font-size: 13px; }
</style>
</head>
<body>
<h2>🎮 Steuerungs-Gerät</h2>
<h3>Offene Zuweisungen</h3>
<div id="contactList"></div>
<div id="empty">Keine offenen Kontakte.</div>
<script type="module" src="control.js"></script>
</body>
</html>
