<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; background: #0d1117; color: #e6edf3; font-family: sans-serif; width: 100%; height: 100%; overflow: hidden; }
  #app { padding: 14px; height: 100%; box-sizing: border-box; overflow-y: auto; }
  #app.hidden { display: none; }
  #minimizedView {
    display: none; height: 100%; align-items: center; justify-content: center; cursor: pointer; font-size: 24px;
  }
  #minimizedView.visible { display: flex; }
  #appHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  #appHeader h2 { color: #58a6ff; font-size: 16px; margin: 0; }
  #minimizeBtn { background: #30363d; color: #e6edf3; border: none; border-radius: 5px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 14px; }
  .panelHeader { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; cursor: pointer; user-select: none; }
  .panelHeader h3 { margin: 0; font-size: 13px; color: #58a6ff; text-transform: uppercase; }
  .panelHeader .toggle { font-size: 14px; color: #8b949e; }
  .panelBody { padding: 0 12px 12px 12px; }
  .panelBody.collapsed { display: none; }
  .contact { background: #0d1117; border: 1px solid #ffb020; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .contact .label { color: #ffb020; font-weight: bold; margin-bottom: 6px; font-size: 13px; font-family: monospace; }
  .tokenOption { background: #21262d; padding: 8px 10px; border-radius: 5px; margin-bottom: 4px; cursor: pointer; font-size: 13px; }
  .tokenOption:hover, .tokenOption:active { background: #3a7bd5; }
  #empty { color: #6e7681; font-style: italic; font-size: 13px; padding: 4px 12px 12px; }
</style>
</head>
<body>
<div id="minimizedView">🎮</div>
<div id="app">
  <div id="appHeader">
    <h2>🎮 Steuerungs-Gerät</h2>
    <button id="minimizeBtn">Einklappen</button>
  </div>
  <div class="panel">
    <div class="panelHeader" id="panelHeader">
      <h3>Offene Zuweisungen</h3>
      <span class="toggle" id="toggleIcon">▾</span>
    </div>
    <div class="panelBody" id="panelBody">
      <div id="contactList"></div>
      <div id="empty">Keine offenen Kontakte.</div>
    </div>
  </div>
</div>
<script type="module" src="control.js?v=6"></script>
</body>
</html>
