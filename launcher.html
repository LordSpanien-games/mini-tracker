<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; font-family: sans-serif; background: #1a1a1a; color: #eee; padding: 16px; }
  button { width: 100%; padding: 12px; font-size: 14px; border-radius: 6px; border: none; background: #3a7bd5; color: white; cursor: pointer; }
  #status { margin-top: 10px; font-size: 12px; color: #0f0; }
</style>
</head>
<body>
<p>Mini-Tracker Overlay</p>
<button id="openBtn">Vollbild-Overlay öffnen</button>
<div id="status"></div>

<script type="module">
import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk/dist/index.min.js";

const status = document.getElementById("status");
const btn = document.getElementById("openBtn");

OBR.onReady(() => {
  status.textContent = "SDK bereit.";
});

async function openOverlay() {
  await OBR.popover.open({
    id: "com.minitracker.overlay",
    url: "overlay.html",
    width: window.screen.width,
    height: window.screen.height,
    anchorReference: "POSITION",
    anchorPosition: { left: 0, top: 0 },
    hidePaper: true,
    disableClickAway: true,
  });
  status.textContent = "Overlay geöffnet.";
}

btn.addEventListener("click", openOverlay);
</script>
</body>
</html>
